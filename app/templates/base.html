<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Amazon reconciliation{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">Amazon invoices</a>
  {% set path = request.url.path %}
  <nav>
    <a href="/" class="navbtn {% if path == '/' %}active{% endif %}">Home</a>
    <a href="/charges" class="navbtn {% if path.startswith('/charges') %}active{% endif %}">Charges</a>
    <a href="/orders" class="navbtn {% if path.startswith('/orders') %}active{% endif %}">Orders</a>
    <a href="/advanced" class="navbtn {% if path.startswith('/advanced') or path.startswith('/bank') or path.startswith('/review') %}active{% endif %}">Advanced</a>
  </nav>
</header>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
